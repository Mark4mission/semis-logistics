<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1f26">
<meta name="robots" content="noindex">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<script src="js/loginguard.js?v=1.19.0"></script>
<title>SeMIS · Logistics — 인천화물팀 안전보안</title>
<link rel="icon" type="image/svg+xml" href="assets/mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="preload" as="image" href="assets/img/login-dusk.webp" type="image/webp" fetchpriority="high" media="(min-width: 861px)">
<link rel="stylesheet" href="css/main.css?v=1.19.0">
</head>
<body>

<!-- ═══════════ 로그인 ═══════════ -->
<div id="login-overlay" class="login-overlay">
  <div class="login-shell">
    <aside class="login-brand">
      <div class="lb-brand"><img src="assets/mark.svg" alt="" width="44" height="44"><span>SeMIS <b>Logistics</b></span></div>
      <div class="lb-body">
        <h1 class="lb-title">화물터미널<br>안전보안 관리<br>정보시스템</h1>
        <div class="lb-tag" aria-hidden="true">
          <div class="lb-tag-top"><span>안전 · 보안</span><span class="mono">ICNKF</span></div>
          <div class="lb-tag-grid">
            <div><small>운영사</small><b>에어제타</b></div>
            <div><small>소속</small><b>인천화물팀</b></div>
            <div><small>부서</small><b>안전보안파트</b></div>
            <div><small>시스템</small><b>SeMIS · Logistics</b></div>
          </div>
          <div class="lb-tag-foot">Cargo Terminal Safety &amp; Security Management</div>
        </div>
      </div>
      <div class="lb-foot">에어제타 인천화물팀 안전보안파트</div>
    </aside>
    <div class="login-main">
      <form id="login-form" class="login-card" autocomplete="off">
        <div class="login-mhead"><img src="assets/mark.svg" alt="" width="40" height="40"><span>SeMIS <b>Logistics</b></span></div>
        <h2 class="login-title">로그인</h2>
        <label class="login-label" for="login-pw">접속 암호</label>
        <div class="login-input-wrap">
          <input type="password" id="login-pw" autocomplete="current-password" autofocus>
          <button type="button" id="pw-toggle" class="pw-toggle" tabindex="-1" aria-label="암호 표시"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <button type="submit" class="btn btn-primary login-btn">로그인</button>
        <p id="login-error" class="login-error" role="alert"></p>
        <p class="login-foot"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>인가된 사용자 전용</p>
      </form>
    </div>
  </div>
</div>

<!-- ═══════════ 앱 셸 — 레일 · 허브 패널 · 상단바 · 본문 · 모바일 탭 ═══════════ -->
<div id="app" class="app hidden">

  <nav id="rail" class="rail" aria-label="업무 허브">
    <a class="rail-logo" href="#/dashboard" aria-label="대시보드"><img src="assets/mark.svg" alt="" width="38" height="38"></a>
    <div id="rail-hubs" class="rail-hubs"></div>
    <div class="rail-spacer"></div>
    <div id="rail-util" class="rail-util"></div>
  </nav>

  <aside id="sidebar" class="sidebar panel" aria-label="메뉴">
    <div class="panel-brand">
      <div class="pb-text"><span class="pb-name">SeMIS <b>Logistics</b></span><span class="pb-sub">인천화물팀 안전보안파트</span></div>
      <button type="button" id="sheet-close" class="icon-btn sheet-only" aria-label="메뉴 닫기"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <button type="button" class="panel-search" data-search-open>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
      <span>메뉴·문서 검색</span><kbd>Ctrl K</kbd>
    </button>
    <div id="nav-menu" class="nav-menu"></div>
    <div class="panel-foot">
      <button id="sync-status" class="sync-dot" type="button" title="동기화 상태"></button>
      <button type="button" id="sheet-logout" class="sheet-only sheet-logout">로그아웃</button>
      <span id="app-version" class="mono"></span>
    </div>
  </aside>
  <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

  <header class="header">
    <button id="menu-toggle" class="icon-btn" type="button" aria-label="메뉴 패널 접기·펼치기" title="메뉴 패널 접기·펼치기"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M9.5 4.5v15"/></svg></button>
    <a class="brand" href="#/dashboard"><img src="assets/mark.svg" alt="" width="30" height="30"><span class="brand-text">SeMIS <b>Logistics</b></span></a>
    <nav id="crumbs" class="crumbs" aria-label="현재 위치"></nav>
    <div class="header-right">
      <button id="hdr-search-btn" class="icon-btn search-btn-m" type="button" data-search-open aria-label="통합 검색" title="통합 검색 (Ctrl K)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg></button>
      <span id="sec-level-badge" class="sec-badge" title="현재 국가 항공보안등급"></span>
      <span id="user-chip" class="user-chip"></span>
      <button id="logout-btn" class="icon-btn" type="button" title="로그아웃" aria-label="로그아웃"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
    </div>
  </header>

  <main id="main" class="main">
    <div id="view" class="view"></div>
  </main>

  <nav id="tabbar" class="tabbar" aria-label="하단 메뉴"></nav>
</div>

<!-- 통합 검색 (Ctrl K) -->
<div id="cmdk" class="cmdk hidden">
  <div class="cmdk-box" role="dialog" aria-modal="true" aria-label="통합 검색">
    <div id="hdr-search-wrap" class="hdr-search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
      <input id="hdr-search" type="search" placeholder="메뉴 · 공지 · 일정 · 회의록 · 연락망 검색" autocomplete="off" aria-label="통합 검색">
      <kbd>Esc</kbd>
      <div id="hdr-search-pop" class="search-pop hidden"></div>
    </div>
  </div>
</div>

<!-- 범용 모달 -->
<div id="modal-overlay" class="modal-overlay hidden">
  <div id="modal-box" class="modal-box" role="dialog" aria-modal="true"></div>
</div>

<!-- 토스트 -->
<div id="toast-wrap" class="toast-wrap"></div>

<script src="js/main.js?v=1.19.0" defer></script>
</body>
</html>
